<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Locktober Hat PFP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <canvas id="pfpCanvas" width="500" height="500"></canvas>
    <div class="controls">
      <button id="addHatBtn">Add Hat</button>
      <label>Scale: <input type="range" id="scaleSlider" min="0.5" max="2" step="0.01" value="1"></label>
      <label>Rotation: <input type="range" id="rotationSlider" min="0" max="360" step="1" value="0"></label>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
